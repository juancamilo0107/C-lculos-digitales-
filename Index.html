<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimizador Lógico: Tabla de Verdad y Mapa de Karnaugh</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 750px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: var(--text-main); }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
        
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1.2rem;
            box-sizing: border-box;
            font-family: monospace;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .keyboard { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 1.5rem; }
        .key {
            background-color: #f1f5f9; border: 1px solid var(--border); border-radius: 6px;
            padding: 0.75rem; font-size: 1.1rem; font-weight: bold; font-family: monospace;
            cursor: pointer; transition: all 0.1s;
        }
        .key:active { background-color: #cbd5e1; transform: scale(0.95); }
        .key.action { background-color: #e2e8f0; color: #b91c1c; }
        
        .radio-group { display: flex; gap: 1.5rem; margin-top: 0.5rem; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        
        .btn-main {
            background-color: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem;
            border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%;
        }
        .btn-main:hover { background-color: var(--primary-hover); }
        
        .result-box {
            margin-top: 2rem; padding: 1.5rem; border-radius: 8px; background-color: #f1f5f9;
            border: 1px solid var(--border); display: none; 
        }
        .result-box h3 { margin-top: 2rem; margin-bottom: 1rem; font-size: 1.1rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem;}
        .result-box h3:first-child { margin-top: 0; }
        
        .final-result { font-size: 1.25rem; font-weight: bold; color: var(--primary); font-family: monospace; margin-bottom: 1.5rem; }
        .steps-list { list-style-type: none; padding: 0; margin: 0; }
        .steps-list li { padding: 0.5rem 0; border-bottom: 1px dashed var(--border); font-family: monospace; font-size: 0.95rem; }
        .steps-list li:last-child { border-bottom: none; }
        .badge { background: #e0e7ff; color: #4338ca; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-family: sans-serif; margin-right: 0.5rem; font-weight: bold;}

        /* Tablas */
        table { width: 100%; border-collapse: collapse; background-color: white; text-align: center; font-family: monospace; font-size: 1rem; margin-bottom: 1rem; }
        th, td { border: 1px solid var(--border); padding: 0.5rem; }
        th { background-color: #e2e8f0; font-weight: bold; }
        tr:nth-child(even) { background-color: #f8fafc; }
        
        .kmap-table { width: auto; margin: 0 auto; }
        .kmap-table th { background-color: #cbd5e1; }
        .kmap-corner { background-color: #94a3b8 !important; color: white; text-align: right; position: relative; }
        .kmap-highlight-sop { background-color: #bfdbfe !important; font-weight: bold; color: #1e3a8a; }
        .kmap-highlight-pos { background-color: #fecaca !important; font-weight: bold; color: #7f1d1d; }
        .kmap-table td { width: 40px; height: 40px; font-size: 1.2rem; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        @media(max-width: 600px) { .grid-layout { grid-template-columns: 1fr; } }
        
        #kmapContainer { text-align: center; }

        /* Mapa Karnaugh Estilo Imagen (Oscuro) */
        .kmap-widget {
            display: inline-grid;
            grid-template-columns: 30px 10px 50px 50px 50px 50px 10px 30px;
            grid-template-rows: 30px 10px 50px 50px 50px 50px 10px 30px;
            background-color: #172033;
            color: #63b3ed;
            font-family: sans-serif;
            padding: 15px;
            border-radius: 8px;
            align-items: center;
            justify-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin: 0 auto;
        }
        .klabel { font-weight: bold; font-size: 1rem; }
        .kmap-inner-grid {
            display: grid;
            grid-template-columns: repeat(4, 50px);
            grid-template-rows: repeat(4, 50px);
            gap: 2px;
            background-color: #4299e1; 
            border: 2px solid #4299e1;
            padding: 2px;
            border-radius: 4px;
        }
        .kmap-cell {
            background-color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            box-sizing: border-box;
        }
        .kmap-val {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #26334d;
            color: #718096;
            border: 2.5px solid transparent;
            box-sizing: border-box;
        }
        .kmap-val.highlight-sop {
            border-color: #3b82f6; 
            color: #ffffff;
            background-color: rgba(59, 130, 246, 0.2);
        }
        .kmap-val.highlight-pos {
            border-color: #ef4444; 
            color: #ffffff;
            background-color: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Minimizador Lógico (K-Map & Pasos)</h1>
    <p>Ingresa tu función. La aplicación mostrará la tabla de verdad, el Mapa de Karnaugh ubicando los resultados, y la reducción paso a paso.</p>
    
    <div class="form-group">
        <div class="radio-group">
            <label><input type="radio" name="format" value="SOP" checked> Suma de Prod. (SOP)</label>
            <label><input type="radio" name="format" value="POS"> Producto de Sumas (POS)</label>
        </div>
    </div>

    <div class="form-group">
        <input type="text" id="expression" placeholder="Ej. A'B + AB'" readonly>
        
        <div class="keyboard">
            <button class="key" onclick="typeChar('A')">A</button>
            <button class="key" onclick="typeChar('B')">B</button>
            <button class="key" onclick="typeChar('C')">C</button>
            <button class="key" onclick="typeChar('D')">D</button>
            <button class="key action" onclick="backspace()">⌫</button>
            
            <button class="key" onclick="typeChar('\'')">' (Neg)</button>
            <button class="key" onclick="typeChar('+')">+</button>
            <button class="key" onclick="typeChar('(')">(</button>
            <button class="key" onclick="typeChar(')')">)</button>
            <button class="key action" onclick="clearInput()">C</button>
        </div>
    </div>

    <button class="btn-main" onclick="processFunction()">Evaluar y Minimizar</button>

    <div class="result-box" id="resultBox">
        <h3>Resultado Final Simplificado:</h3>
        <div class="final-result" id="finalResult"></div>
        
        <h3>Proceso Algebraico:</h3>
        <ul class="steps-list" id="stepsList"></ul>

        <div class="grid-layout">
            <div>
                <h3>Tabla de Verdad:</h3>
                <div id="truthTableContainer"></div>
            </div>
            <div>
                <h3>Mapa de Karnaugh:</h3>
                <div id="kmapContainer"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function typeChar(char) { document.getElementById('expression').value += char; }
    function backspace() { let input = document.getElementById('expression'); input.value = input.value.slice(0, -1); }
    function clearInput() { document.getElementById('expression').value = ''; }

    function processFunction() {
        const input = document.getElementById('expression').value.trim();
        const isPos = document.querySelector('input[name="format"]:checked').value === 'POS';
        const resultBox = document.getElementById('resultBox');
        
        if (!input) { alert("Por favor, ingresa una función booleana."); return; }

        let originalTerms = parseExpression(input, isPos);
        
        let varSet = new Set();
        originalTerms.forEach(term => term.forEach(lit => varSet.add(lit.replace("'", ""))));
        let variables = Array.from(varSet).sort();
        
        generateTruthTable(originalTerms, isPos, variables);
        generateKMap(originalTerms, isPos, variables);
        minimizeFunction(JSON.parse(JSON.stringify(originalTerms)), isPos);
        
        resultBox.style.display = 'block';
    }

    function generateKMap(terms, isPos, variables) {
        const container = document.getElementById('kmapContainer');
        if (variables.length > 4 || variables.length === 0) {
            container.innerHTML = "<p style='color: #64748b;'>El Mapa de Karnaugh solo se grafica para funciones de 1 a 4 variables.</p>";
            return;
        }

        let html = '';

        if (variables.length === 4) {
            let colVars = [variables[0], variables[1]]; 
            let rowVars = [variables[2], variables[3]]; 
            
            let rowCodes = ['00', '01', '11', '10'];
            let colCodes = ['00', '01', '11', '10'];

            html += `<div class="kmap-widget">`;
            html += `<div class="klabel" style="grid-area: 1 / 3 / 2 / 5;">${colVars[0]}'</div>`;
            html += `<div class="klabel" style="grid-area: 1 / 5 / 2 / 7;">${colVars[0]}</div>`;
            html += `<div class="klabel" style="grid-area: 8 / 3 / 9 / 4;">${colVars[1]}'</div>`;
            html += `<div class="klabel" style="grid-area: 8 / 4 / 9 / 6;">${colVars[1]}</div>`;
            html += `<div class="klabel" style="grid-area: 8 / 6 / 9 / 7;">${colVars[1]}'</div>`;
            html += `<div class="klabel" style="grid-area: 3 / 1 / 5 / 2;">${rowVars[0]}'</div>`;
            html += `<div class="klabel" style="grid-area: 5 / 1 / 7 / 2;">${rowVars[0]}</div>`;
            html += `<div class="klabel" style="grid-area: 3 / 8 / 4 / 9;">${rowVars[1]}'</div>`;
            html += `<div class="klabel" style="grid-area: 4 / 8 / 6 / 9;">${rowVars[1]}</div>`;
            html += `<div class="klabel" style="grid-area: 6 / 8 / 7 / 9;">${rowVars[1]}'</div>`;

            html += `<div class="kmap-inner-grid" style="grid-area: 3 / 3 / 7 / 7;">`;
            
            rowCodes.forEach(rCode => {
                colCodes.forEach(cCode => {
                    let assignment = {};
                    assignment[colVars[0]] = parseInt(cCode[0]);
                    assignment[colVars[1]] = parseInt(cCode[1]);
                    assignment[rowVars[0]] = parseInt(rCode[0]);
                    assignment[rowVars[1]] = parseInt(rCode[1]);

                    let val = evaluateTruth(terms, isPos, assignment) ? 1 : 0;
                    let innerClass = "kmap-val";
                    
                    if (!isPos && val === 1) innerClass += " highlight-sop";
                    if (isPos && val === 0) innerClass += " highlight-pos";

                    html += `<div class="kmap-cell"><div class="${innerClass}">${val}</div></div>`;
                });
            });
            html += `</div></div>`;
            
        } else {
            let rowVars = [], colVars = [];
            if (variables.length === 1) { rowVars = [variables[0]]; colVars = []; }
            else if (variables.length === 2) { rowVars = [variables[0]]; colVars = [variables[1]]; }
            else if (variables.length === 3) { rowVars = [variables[0]]; colVars = [variables[1], variables[2]]; }

            const getGrayCode = (numVars) => {
                if (numVars === 0) return [''];
                if (numVars === 1) return ['0', '1'];
                if (numVars === 2) return ['00', '01', '11', '10'];
            }

            let rowCodes = getGrayCode(rowVars.length);
            let colCodes = getGrayCode(colVars.length);

            html += '<table class="kmap-table"><tr>';
            let cornerText = colVars.length > 0 ? `${rowVars.join('')} \\ ${colVars.join('')}` : `${rowVars.join('')}`;
            html += `<th class="kmap-corner">${cornerText}</th>`;
            
            if (colVars.length > 0) { colCodes.forEach(c => html += `<th>${c}</th>`); }
            html += '</tr>';

            rowCodes.forEach(rCode => {
                html += `<tr><th>${rCode}</th>`;
                let loopCols = colVars.length > 0 ? colCodes : [''];
                
                loopCols.forEach(cCode => {
                    let assignment = {};
                    for(let i=0; i<rowVars.length; i++) assignment[rowVars[i]] = parseInt(rCode[i]);
                    for(let i=0; i<colVars.length; i++) assignment[colVars[i]] = parseInt(cCode[i]);

                    let val = evaluateTruth(terms, isPos, assignment) ? 1 : 0;
                    let cellClass = "";
                    if (!isPos && val === 1) cellClass = "kmap-highlight-sop";
                    if (isPos && val === 0) cellClass = "kmap-highlight-pos";

                    html += `<td class="${cellClass}">${val}</td>`;
                });
                html += '</tr>';
            });
            html += '</table>';
        }
        
        container.innerHTML = html;
    }

    function generateTruthTable(terms, isPos, variables) {
        if (variables.length === 0) {
            document.getElementById('truthTableContainer').innerHTML = "<p>No hay variables.</p>";
            return;
        }

        let html = '<table><thead><tr>';
        variables.forEach(v => html += `<th>${v}</th>`);
        html += `<th style="color:var(--primary);">F</th></tr></thead><tbody>`;

        let numRows = Math.pow(2, variables.length);
        for (let i = 0; i < numRows; i++) {
            let assignment = {};
            html += '<tr>';
            for (let j = 0; j < variables.length; j++) {
                let bit = (i >> (variables.length - 1 - j)) & 1;
                assignment[variables[j]] = bit;
                html += `<td>${bit}</td>`;
            }
            let fValue = evaluateTruth(terms, isPos, assignment);
            html += `<td style="font-weight:bold; color:var(--primary);">${fValue ? 1 : 0}</td></tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('truthTableContainer').innerHTML = html;
    }

    function evaluateTruth(terms, isPos, assignment) {
        if (terms.length === 0) return !isPos; 
        if (isPos) {
            return terms.every(term => term.some(lit => {
                let isNeg = lit.endsWith("'");
                let v = lit.replace("'", "");
                return isNeg ? !assignment[v] : assignment[v];
            }));
        } else {
            return terms.some(term => term.every(lit => {
                let isNeg = lit.endsWith("'");
                let v = lit.replace("'", "");
                return isNeg ? !assignment[v] : assignment[v];
            }));
        }
    }

    // --- Algoritmo Algebraico Heurístico Avanzado ---
    function minimizeFunction(originalTerms, isPos) {
        const finalResultEl = document.getElementById('finalResult');
        const stepsListEl = document.getElementById('stepsList');
        stepsListEl.innerHTML = ''; 
        let steps = [];
        let terms = JSON.parse(JSON.stringify(originalTerms));

        let varSet = new Set();
        terms.forEach(t => t.forEach(l => varSet.add(l.replace("'", ""))));
        let globalVars = Array.from(varSet).sort();

        let history = new Set();
        let changed = true;
        let iter = 0;

        while (changed && iter < 100) {
            changed = false;
            iter++;

            // Protección contra bucles infinitos
            let stateStr = terms.map(t => [...t].sort().join('')).sort().join('+');
            if (history.has(stateStr)) break;
            history.add(stateStr);

            // 1. Idempotencia
            for (let i = 0; i < terms.length; i++) {
                for (let j = i + 1; j < terms.length; j++) {
                    if (checkIdempotence(terms[i], terms[j])) {
                        steps.push(`<span class="badge">Idempotencia</span> Duplicado de ${formatTerm(terms[i], isPos)} eliminado.`);
                        terms.splice(j, 1); changed = true; break;
                    }
                } if (changed) break;
            } if (changed) continue;

            // 2. Absorción: X + XY = X
            for (let i = 0; i < terms.length; i++) {
                for (let j = 0; j < terms.length; j++) {
                    if (i !== j && checkAbsorption(terms[i], terms[j])) {
                        steps.push(`<span class="badge">Absorción</span> ${formatTerm(terms[i], isPos)} absorbió a ${formatTerm(terms[j], isPos)}.`);
                        terms.splice(j, 1); changed = true; break;
                    }
                } if (changed) break;
            } if (changed) continue;

            // 3. Adyacencia: XY + XY' = X
            for (let i = 0; i < terms.length; i++) {
                for (let j = i + 1; j < terms.length; j++) {
                    let adj = checkAdjacency(terms[i], terms[j]);
                    if (adj) {
                        let t1Str = formatTerm(terms[i], isPos), t2Str = formatTerm(terms[j], isPos);
                        let newStr = formatTerm(adj, isPos) || (isPos ? "0" : "1");
                        steps.push(`<span class="badge">Adyacencia</span> ${t1Str} y ${t2Str} &rarr; ${newStr}`);
                        terms.splice(j, 1); terms.splice(i, 1);
                        if (adj.length > 0) terms.push(adj); else terms = [];
                        changed = true; break;
                    }
                } if (changed) break;
            } if (changed) continue;

            // 4. Simplificación por Eliminación (X + X'Y = X + Y)
            for (let i = 0; i < terms.length; i++) {
                for (let j = 0; j < terms.length; j++) {
                    if (i === j) continue;
                    let elim = checkElimination(terms[i], terms[j]);
                    if (elim) {
                        let oldT2Str = formatTerm(terms[j], isPos), newT2Str = formatTerm(elim, isPos);
                        steps.push(`<span class="badge">Simplificación</span> Por la presencia de ${formatTerm(terms[i], isPos)}, ${oldT2Str} &rarr; ${newT2Str}`);
                        terms[j] = elim; changed = true; break;
                    }
                } if (changed) break;
            } if (changed) continue;

            // 5. Cobertura Lógica Total (Eliminar términos no esenciales)
            if (terms.length > 1) {
                let sortedIndices = terms.map((t, idx) => ({t, idx})).sort((a,b) => b.t.length - a.t.length);
                for (let item of sortedIndices) {
                    let i = item.idx;
                    let testTerms = terms.filter((_, idx) => idx !== i);
                    if (areFunctionsEquivalent(terms, testTerms, isPos, globalVars)) {
                        steps.push(`<span class="badge">Redundancia Lógica</span> ${formatTerm(terms[i], isPos)} se elimina por estar completamente cubierto (Consenso).`);
                        terms.splice(i, 1);
                        changed = true; break;
                    }
                }
            }
            if (changed) continue;

            // 6. Expansión Estratégica
            let expansionAdded = false;
            for (let i = 0; i < terms.length; i++) {
                for (let j = i + 1; j < terms.length; j++) {
                    let cons = getConsensus(terms[i], terms[j]);
                    if (cons && !terms.some(t => checkIdempotence(t, cons)) && !terms.some(t => checkAbsorption(t, cons))) {
                        let useful = terms.some(t => checkAdjacency(cons, t) || checkElimination(cons, t));
                        if (useful) {
                            steps.push(`<span class="badge">Expansión</span> Agregando término ${formatTerm(cons, isPos)} para destrabar adyacencias.`);
                            terms.push(cons);
                            expansionAdded = true; break;
                        }
                    }
                } if (expansionAdded) break;
            } if (expansionAdded) { changed = true; continue; }
        }

        // 7. RESPALDO INFALIBLE: Algoritmo Matemático de Quine-McCluskey (Verificación Absoluta)
        let qmcTerms = runQuineMcCluskey(originalTerms, isPos, globalVars);
        if (qmcTerms && isShorter(qmcTerms, terms)) {
            steps.push(`<span class="badge">K-Map (Q-M)</span> Heurística algebraica completada. Alcanzando el mínimo absoluto mediante algoritmo de Mapas de Karnaugh.`);
            terms = qmcTerms;
        }

        if (steps.length === 0) steps.push("<li>La función ya se encuentra en su forma mínima.</li>");
        else steps = steps.map(s => `<li>${s}</li>`);
        
        finalResultEl.textContent = formatExpression(terms, isPos);
        stepsListEl.innerHTML = steps.join('');
    }

    // --- Motor de Respaldo: Quine-McCluskey (Garantiza Mínimo) ---
    function runQuineMcCluskey(terms, isPos, vars) {
        if (vars.length === 0) return terms;
        let numRows = Math.pow(2, vars.length);
        let minterms = [];
        for (let i = 0; i < numRows; i++) {
            let assignment = {};
            for (let j = 0; j < vars.length; j++) assignment[vars[j]] = (i >> (vars.length - 1 - j)) & 1;
            if (evaluateTruth(terms, isPos, assignment)) minterms.push(i);
        }
        if (minterms.length === 0) return []; 
        if (minterms.length === numRows) return [[]]; 

        let binTerms = minterms.map(m => m.toString(2).padStart(vars.length, '0'));
        let primeImplicants = new Set();
        let currentGroup = binTerms;
        
        // Generar implicantes primos
        while (currentGroup.length > 0) {
            let nextGroup = new Set();
            let merged = new Set();
            for (let i = 0; i < currentGroup.length; i++) {
                for (let j = i + 1; j < currentGroup.length; j++) {
                    let c = qmcCombine(currentGroup[i], currentGroup[j]);
                    if (c) {
                        nextGroup.add(c);
                        merged.add(currentGroup[i]);
                        merged.add(currentGroup[j]);
                    }
                }
            }
            for (let t of currentGroup) {
                if (!merged.has(t)) primeImplicants.add(t);
            }
            currentGroup = Array.from(nextGroup);
        }

        let pis = Array.from(primeImplicants);
        let remaining = new Set(binTerms);
        let solution = [];
        
        // Encontrar cobertura mínima
        while(remaining.size > 0) {
            let counts = {};
            remaining.forEach(m => counts[m] = []);
            pis.forEach(pi => { remaining.forEach(m => { if (qmcCovers(pi, m)) counts[m].push(pi); }); });

            let essentialFound = false;
            for (let m of remaining) {
                if (counts[m].length === 1) {
                    let epi = counts[m][0];
                    solution.push(epi);
                    pis = pis.filter(p => p !== epi);
                    let toDelete = [];
                    remaining.forEach(rm => { if(qmcCovers(epi, rm)) toDelete.push(rm); });
                    toDelete.forEach(d => remaining.delete(d));
                    essentialFound = true; break;
                }
            }
            if (!essentialFound && remaining.size > 0) {
                let bestPi = null, maxCover = -1;
                pis.forEach(pi => {
                    let c = 0;
                    remaining.forEach(m => { if(qmcCovers(pi, m)) c++; });
                    if (c > maxCover) { maxCover = c; bestPi = pi; }
                });
                if (bestPi) {
                    solution.push(bestPi);
                    pis = pis.filter(p => p !== bestPi);
                    let toDelete = [];
                    remaining.forEach(rm => { if(qmcCovers(bestPi, rm)) toDelete.push(rm); });
                    toDelete.forEach(d => remaining.delete(d));
                } else break; 
            }
        }

        return solution.map(bin => {
            let t = [];
            for (let i = 0; i < bin.length; i++) {
                if (bin[i] !== '-') {
                    if (isPos) t.push(bin[i] === '1' ? vars[i] + "'" : vars[i]);
                    else t.push(bin[i] === '0' ? vars[i] + "'" : vars[i]);
                }
            }
            return t;
        });
    }

    function qmcCombine(t1, t2) {
        let diffs = 0, res = '';
        for (let i = 0; i < t1.length; i++) {
            if (t1[i] !== t2[i]) { diffs++; res += '-'; }
            else res += t1[i];
        }
        return diffs === 1 ? res : null;
    }
    function qmcCovers(pi, m) {
        for (let i = 0; i < pi.length; i++) if (pi[i] !== '-' && pi[i] !== m[i]) return false;
        return true;
    }
    
    function isShorter(t1, t2) {
        let len1 = t1.reduce((sum, term) => sum + term.length, 0);
        let len2 = t2.reduce((sum, term) => sum + term.length, 0);
        if (t1.length < t2.length) return true;
        if (t1.length === t2.length && len1 < len2) return true;
        return false;
    }

    // --- Utilidades lógicas y formato ---
    function parseExpression(input, isPos) {
        let termsRaw = isPos ? (input.match(/\(([^)]+)\)/g) || input.split('*')) : input.split('+');
        return termsRaw.map(t => (t.match(/[a-zA-Z]'?/g) || []).map(l => l.toUpperCase()).sort()).filter(t => t.length > 0);
    }
    function checkIdempotence(t1, t2) { return t1.length === t2.length && t1.every((lit, idx) => lit === t2[idx]); }
    function checkAbsorption(t1, t2) { return t1.length < t2.length && t1.every(lit => t2.includes(lit)); }
    function checkAdjacency(t1, t2) {
        if (t1.length !== t2.length) return null;
        let diffs = 0, diffIndex = -1;
        for (let i = 0; i < t1.length; i++) {
            if (t1[i] !== t2[i]) {
                if (t1[i].replace("'", "") === t2[i].replace("'", "")) { diffs++; diffIndex = i; } 
                else return null;
            }
        }
        if (diffs === 1) { let newTerm = [...t1]; newTerm.splice(diffIndex, 1); return newTerm; }
        return null;
    }
    function checkElimination(t1, t2) {
        let oppCount = 0, oppIndex = -1;
        for (let lit of t1) {
            if (t2.includes(lit)) continue;
            let opp = lit.endsWith("'") ? lit[0] : lit + "'";
            let idx = t2.indexOf(opp);
            if (idx !== -1) { oppCount++; oppIndex = idx; } else return null; 
        }
        if (oppCount === 1) { let newT2 = [...t2]; newT2.splice(oppIndex, 1); return newT2; }
        return null;
    }
    function getConsensus(t1, t2) {
        let oppCount = 0, oppVar = "";
        for (let lit of t1) {
            let opp = lit.endsWith("'") ? lit[0] : lit + "'";
            if (t2.includes(opp)) { oppCount++; oppVar = lit.replace("'", ""); }
        }
        if (oppCount === 1) { 
            let consensus = [];
            for (let lit of t1) if (lit.replace("'", "") !== oppVar) consensus.push(lit);
            for (let lit of t2) if (lit.replace("'", "") !== oppVar && !consensus.includes(lit)) consensus.push(lit);
            return consensus.sort();
        }
        return null;
    }
    function areFunctionsEquivalent(terms1, terms2, isPos, globalVars) {
        if (globalVars.length === 0) return true;
        let numRows = Math.pow(2, globalVars.length);
        for (let i = 0; i < numRows; i++) {
            let assignment = {};
            for (let j = 0; j < globalVars.length; j++) assignment[globalVars[j]] = (i >> (globalVars.length - 1 - j)) & 1;
            if (evaluateTruth(terms1, isPos, assignment) !== evaluateTruth(terms2, isPos, assignment)) return false;
        }
        return true;
    }
    function formatTerm(termArray, isPos) {
        if (!termArray || termArray.length === 0) return "";
        return isPos ? "(" + termArray.join(" + ") + ")" : termArray.join("");
    }
    function formatExpression(termsArray, isPos) {
        if (termsArray.length === 0) return isPos ? "0" : "1";
        return isPos ? termsArray.map(t => formatTerm(t, isPos)).join("") : termsArray.map(t => formatTerm(t, isPos)).join(" + ");
    }
